# Amount-based rules (applied after keyword matching fails).
# Use for unnamed transactions (e.g. checks) where the amount is the only signal.
# 'amount' is matched against the absolute value; 'tolerance' defaults to $0.01.
amount_rules:
  - category: preschool
    amount: 290.00
