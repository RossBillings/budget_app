# Keyword-based transaction categories for budget_app.
# Groups are evaluated top-to-bottom; the first matching group wins.
# Keywords are matched case-insensitively against the transaction description.

settings:
  default_category: misc

exclude_keywords:
  - capital one mobile pymt

