# Budget App Category Configuration
# This file defines how transactions are categorized based on description keywords
# and how external categories (like Chase United) are mapped to internal categories

# Category keyword patterns for automatic categorization
# Each category contains a list of keywords that will trigger that categorization
# Keywords are case-insensitive and support partial matching
