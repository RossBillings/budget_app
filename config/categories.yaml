# External category mappings (e.g., from Chase United to internal categories)
external_category_mappings:
  
  # Chase United format mappings
  chase_united:
    "groceries": "groceries"
    "food & drink": "dining" 
    "shopping": "target"
    "gas": "gas"
    "home": "home_supplies"
    "travel": "automotive"
    "entertainment": "entertainment"
    "health & wellness": "health"
    "personal": "misc"
    "gifts & donations": "tithe"
    "bills & utilities": "utilities"
    "fees & charges": "misc"
    "transfer": "transfer"
    "payment": "transfer"
  
  # Capital One format mappings (if needed)
  capital_one:
    "merchandise": "target"
    "gas/automotive": "gas"
    "other services": "misc"
    "other": "misc"
    "payment/credit": "transfer"
    "other travel": "automotive"
    "phone/cable": "utilities"
    "health care": "health"
    
  # USAA format mappings (if needed)  
  usaa:
    "category pending": "misc"
    "credit card payment": "transfer"
    "life insurance": "insurance"
    "financial": "transfer"
    "bills & utilities": "utilities"
    "investments": "retirement"
    "uncategorized": "misc"
    "check": "transfer"
    "mortgage & rent": "bilbrowhomes"
    "auto payment": "automotive"
    "charity": "tithe"
    "television": "utilities"
    "interest income": "income"
    "gifts & donations": "tithe"
    "mortgage payment": "bilbrowhomes"

# Configuration settings
settings:
  # Default category for unmatched transactions
  default_category: "misc"
  
  # Case sensitivity for keyword matching
  case_sensitive: false
  
  # Priority order for category checking (first match wins)
  category_priority:
    - "required"
    - "tithe"  
    - "utilities"
    - "insurance"
    - "income"
    - "transfer"
    - "dining"
    - "groceries"
    - "automotive"
    - "home_supplies"
    - "target"
    - "subscription"
    - "gas"
    - "bilbrowhomes"
    - "health"
    - "retirement"
    - "entertainment"
    - "shopping"
    # misc is always last (default)
