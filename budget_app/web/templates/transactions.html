{% extends "base.html" %}

{% block title %}Transactions - Budget App{% endblock %}

{% block content %}
<div class="row">
    <!-- Filters -->
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-filter me-2"></i>Filter Transactions</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <label for="category-filter" class="form-label">Category</label>
                        <select class="form-select" id="category-filter">
                            <option value="all">All Categories</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="start-date" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="start-date">
                    </div>
                    <div class="col-md-3">
                        <label for="end-date" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="end-date">
                    </div>
                    <div class="col-md-3">
                        <label for="keyword-search" class="form-label">Keyword</label>
                        <input type="text" class="form-control" id="keyword-search" placeholder="Search...">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-3">
                        <label for="sort-by" class="form-label">Sort By</label>
                        <select class="form-select" id="sort-by">
                            <option value="date">Date</option>
                            <option value="amount">Amount</option>
                            <option value="description">Description</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="sort-order" class="form-label">Order</label>
                        <select class="form-select" id="sort-order">
                            <option value="desc">Descending</option>
                            <option value="asc">Ascending</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="limit" class="form-label">Limit</label>
                        <select class="form-select" id="limit">
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="200">200</option>
                            <option value="500">500</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary me-2" id="apply-filters">
                            <i class="fas fa-search me-2"></i>Apply
                        </button>
                        <button class="btn btn-secondary" id="reset-filters">
                            <i class="fas fa-undo me-2"></i>Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Transactions Table -->
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>Transactions</h5>
                <div>
                    <button class="btn btn-outline-success btn-sm" id="export-csv">
                        <i class="fas fa-download me-2"></i>Export CSV
                    </button>
                    <button class="btn btn-outline-primary btn-sm" id="refresh-data">
                        <i class="fas fa-sync-alt me-2"></i>Refresh
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="transactions-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Source</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-tbody">
                            <!-- Transactions will be loaded here -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div>
                        <span id="showing-text">Showing 0 of 0 transactions</span>
                    </div>
                    <div>
                        <button class="btn btn-outline-primary btn-sm" id="load-more">
                            <i class="fas fa-plus me-2"></i>Load More
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentOffset = 0;
let totalTransactions = 0;
let allTransactions = [];

document.addEventListener('DOMContentLoaded', function() {
    BudgetApp.setCurrentPage('transactions');
    loadCategories();
    restoreFilters(); // Restore saved filters
    loadTransactions();
    setupEventListeners();
});

function setupEventListeners() {
    document.getElementById('apply-filters').addEventListener('click', function() {
        currentOffset = 0;
        saveFilters(); // Save filters when applied
        loadTransactions();
    });
    
    document.getElementById('reset-filters').addEventListener('click', resetFilters);
    document.getElementById('load-more').addEventListener('click', loadMoreTransactions);
    document.getElementById('refresh-data').addEventListener('click', function() {
        currentOffset = 0;
        loadTransactions();
    });
    document.getElementById('export-csv').addEventListener('click', exportTransactions);
    
    // Save filters when they change
    document.getElementById('category-filter').addEventListener('change', saveFilters);
    document.getElementById('start-date').addEventListener('change', saveFilters);
    document.getElementById('end-date').addEventListener('change', saveFilters);
    document.getElementById('sort-by').addEventListener('change', saveFilters);
    document.getElementById('sort-order').addEventListener('change', saveFilters);
    document.getElementById('limit').addEventListener('change', saveFilters);
    
    // Debounced search
    const searchInput = document.getElementById('keyword-search');
    searchInput.addEventListener('input', BudgetApp.debounce(function() {
        currentOffset = 0;
        saveFilters(); // Save search term too
        loadTransactions();
    }, 500));
}

function loadCategories() {
    fetch('/api/categories')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                updateCategoryFilter(data.data);
            }
        });
}

function updateCategoryFilter(categories) {
    const select = document.getElementById('category-filter');
    select.innerHTML = '<option value="all">All Categories</option>';
    
    categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category.category;
        option.textContent = `${category.category} ($${category.total.toFixed(2)})`;
        select.appendChild(option);
    });
}

function loadTransactions() {
    const params = new URLSearchParams({
        category: document.getElementById('category-filter').value,
        start_date: document.getElementById('start-date').value,
        end_date: document.getElementById('end-date').value,
        keyword: document.getElementById('keyword-search').value,
        sort_by: document.getElementById('sort-by').value,
        order: document.getElementById('sort-order').value,
        limit: document.getElementById('limit').value,
        offset: currentOffset
    });

    BudgetApp.showLoadingOverlay('Loading transactions...');

    fetch(`/api/transactions?${params}`)
        .then(response => response.json())
        .then(data => {
            BudgetApp.hideLoadingOverlay();
            if (data.success) {
                if (currentOffset === 0) {
                    allTransactions = data.data;
                } else {
                    allTransactions = allTransactions.concat(data.data);
                }
                totalTransactions = data.total;
                displayTransactions(allTransactions);
                updatePagination();
            } else {
                BudgetApp.showNotification('Failed to load transactions', 'danger');
            }
        })
        .catch(error => {
            BudgetApp.hideLoadingOverlay();
            BudgetApp.showNotification('Error loading transactions: ' + error.message, 'danger');
        });
}

function displayTransactions(transactions) {
    const tbody = document.getElementById('transactions-tbody');
    tbody.innerHTML = '';
    
    if (transactions.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center text-muted py-4">
                    <i class="fas fa-inbox fa-2x mb-3"></i>
                    <p>No transactions found</p>
                </td>
            </tr>
        `;
        return;
    }
    
    transactions.forEach(transaction => {
        const row = document.createElement('tr');
        row.setAttribute('data-transaction-id', transaction.id);
        row.innerHTML = `
            <td>${BudgetApp.formatDate(transaction.date)}</td>
            <td>${transaction.description}</td>
            <td>
                <span class="badge bg-secondary category-badge" 
                      onclick="editCategory('${transaction.id}', '${transaction.category}')"
                      data-bs-toggle="tooltip" 
                      title="Click to edit category"
                      style="cursor: pointer;">
                    ${transaction.category}
                    ${transaction.description.startsWith('+') ? ' <i class="fas fa-lock fa-xs" title="Manually set"></i>' : ''}
                </span>
            </td>
            <td class="${transaction.amount >= 0 ? 'text-danger' : 'text-success'}">
                ${transaction.amount >= 0 ? '+' : ''}${BudgetApp.formatCurrency(transaction.amount)}
            </td>
            <td><small class="text-muted">${transaction.source}</small></td>
            <td>
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-info" onclick="viewTransaction('${transaction.id}')" 
                            data-bs-toggle="tooltip" title="View Details">
                        <i class="fas fa-eye"></i>
                    </button>
                    <button class="btn btn-outline-danger" onclick="deleteTransaction('${transaction.id}')"
                            data-bs-toggle="tooltip" title="Delete">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </td>
        `;
        tbody.appendChild(row);
    });
    
    // Reinitialize tooltips
    BudgetApp.setupTooltips();
}

function loadMoreTransactions() {
    currentOffset += parseInt(document.getElementById('limit').value);
    loadTransactions();
}

function updatePagination() {
    const showingText = document.getElementById('showing-text');
    const loadMoreBtn = document.getElementById('load-more');
    
    showingText.textContent = `Showing ${allTransactions.length} of ${totalTransactions} transactions`;
    
    // Hide load more button if all transactions are loaded
    if (allTransactions.length >= totalTransactions) {
        loadMoreBtn.style.display = 'none';
    } else {
        loadMoreBtn.style.display = 'inline-block';
    }
}

function resetFilters() {
    document.getElementById('category-filter').value = 'all';
    document.getElementById('start-date').value = '';
    document.getElementById('end-date').value = '';
    document.getElementById('keyword-search').value = '';
    document.getElementById('sort-by').value = 'date';
    document.getElementById('sort-order').value = 'desc';
    document.getElementById('limit').value = '50';
    
    currentOffset = 0;
    saveFilters(); // Save the reset state
    loadTransactions();
}

function saveFilters() {
    const filters = {
        category: document.getElementById('category-filter').value,
        startDate: document.getElementById('start-date').value,
        endDate: document.getElementById('end-date').value,
        keyword: document.getElementById('keyword-search').value,
        sortBy: document.getElementById('sort-by').value,
        sortOrder: document.getElementById('sort-order').value,
        limit: document.getElementById('limit').value
    };
    localStorage.setItem('transactionFilters', JSON.stringify(filters));
}

function restoreFilters() {
    const saved = localStorage.getItem('transactionFilters');
    if (saved) {
        try {
            const filters = JSON.parse(saved);
            if (filters.category) document.getElementById('category-filter').value = filters.category;
            if (filters.startDate) document.getElementById('start-date').value = filters.startDate;
            if (filters.endDate) document.getElementById('end-date').value = filters.endDate;
            if (filters.keyword) document.getElementById('keyword-search').value = filters.keyword;
            if (filters.sortBy) document.getElementById('sort-by').value = filters.sortBy;
            if (filters.sortOrder) document.getElementById('sort-order').value = filters.sortOrder;
            if (filters.limit) document.getElementById('limit').value = filters.limit;
        } catch (e) {
            console.log('Error restoring filters:', e);
        }
    }
}

function deleteTransaction(id) {
    if (confirm('Are you sure you want to delete this transaction?')) {
        fetch(`/api/transactions/${id}`, { method: 'DELETE' })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Remove from local array
                    allTransactions = allTransactions.filter(t => t.id !== id);
                    displayTransactions(allTransactions);
                    updatePagination();
                    BudgetApp.showNotification('Transaction deleted successfully', 'success');
                } else {
                    BudgetApp.showNotification('Error deleting transaction: ' + data.error, 'danger');
                }
            })
            .catch(error => {
                BudgetApp.showNotification('Error deleting transaction: ' + error.message, 'danger');
            });
    }
}

function viewTransaction(id) {
    const transaction = allTransactions.find(t => t.id === id);
    if (transaction) {
        // Create modal to show transaction details
        const modal = document.createElement('div');
        modal.className = 'modal fade';
        modal.id = 'transactionModal';
        modal.innerHTML = `
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Transaction Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6">
                                <strong>Date:</strong><br>
                                ${BudgetApp.formatDate(transaction.date)}
                            </div>
                            <div class="col-md-6">
                                <strong>Amount:</strong><br>
                                <span class="${transaction.amount >= 0 ? 'text-danger' : 'text-success'}">
                                    ${transaction.amount >= 0 ? '+' : ''}${BudgetApp.formatCurrency(transaction.amount)}
                                </span>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-md-6">
                                <strong>Category:</strong><br>
                                <span class="badge bg-secondary">${transaction.category}</span>
                                ${transaction.description.startsWith('+') ? ' <i class="fas fa-lock fa-xs text-warning" title="Manually set"></i>' : ''}
                            </div>
                            <div class="col-md-6">
                                <strong>Source:</strong><br>
                                ${transaction.source}
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-12">
                                <strong>Description:</strong><br>
                                ${transaction.description}
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        const modalInstance = new bootstrap.Modal(modal);
        modalInstance.show();
        
        // Clean up modal after it's hidden
        modal.addEventListener('hidden.bs.modal', function() {
            document.body.removeChild(modal);
        });
    }
}

function editCategory(transactionId, currentCategory) {
    // Get all available categories from the category filter
    const categorySelect = document.getElementById('category-filter');
    const categories = Array.from(categorySelect.options)
        .map(option => option.value)
        .filter(value => value !== 'all')
        .sort();
    
    // Create category selection modal
    const modalHtml = `
        <div class="modal fade" id="editCategoryModal" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Category</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="new-category" class="form-label">Select Category:</label>
                            <select class="form-select" id="new-category">
                                ${categories.map(cat => 
                                    `<option value="${cat}" ${cat === currentCategory ? 'selected' : ''}>${cat}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="manual-lock">
                            <label class="form-check-label" for="manual-lock">
                                <small>Lock category (prevent auto-recategorization)</small>
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="updateTransactionCategory('${transactionId}')">
                            Update Category
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if it exists
    const existingModal = document.getElementById('editCategoryModal');
    if (existingModal) {
        existingModal.remove();
    }
    
    // Add modal to document
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    // Show modal
    const modal = new bootstrap.Modal(document.getElementById('editCategoryModal'));
    modal.show();
    
    // Clean up modal when hidden
    document.getElementById('editCategoryModal').addEventListener('hidden.bs.modal', function() {
        this.remove();
    });
}

function updateTransactionCategory(transactionId) {
    const newCategory = document.getElementById('new-category').value;
    const isManualLock = document.getElementById('manual-lock').checked;
    
    if (!newCategory) {
        BudgetApp.showNotification('Please select a category', 'warning');
        return;
    }
    
    // Update transaction
    fetch(`/api/transactions/${transactionId}/category`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            category: newCategory,
            manual_lock: isManualLock
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Update local transaction data
            const transaction = allTransactions.find(t => t.id === transactionId);
            if (transaction) {
                transaction.category = newCategory;
                if (isManualLock && !transaction.description.startsWith('+')) {
                    transaction.description = '+' + transaction.description;
                }
            }
            
            // Refresh display
            displayTransactions(allTransactions);
            
            // Close modal and show success
            bootstrap.Modal.getInstance(document.getElementById('editCategoryModal')).hide();
            BudgetApp.showNotification('Category updated successfully', 'success');
        } else {
            BudgetApp.showNotification('Error updating category: ' + data.error, 'danger');
        }
    })
    .catch(error => {
        BudgetApp.showNotification('Error updating category: ' + error.message, 'danger');
    });
}

function exportTransactions() {
    if (allTransactions.length === 0) {
        BudgetApp.showNotification('No transactions to export', 'warning');
        return;
    }
    
    const exportData = allTransactions.map(t => ({
        Date: t.date,
        Description: t.description,
        Category: t.category,
        Amount: t.amount,
        Source: t.source
    }));
    
    const filename = `transactions_${new Date().toISOString().split('T')[0]}.csv`;
    BudgetApp.exportAsCSV(exportData, filename);
    BudgetApp.showNotification('Transactions exported successfully', 'success');
}
</script>
{% endblock %}
